<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Budget App</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Budget">
  <meta name="theme-color" content="#0d1117">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
    body { background: #0d1117; color: #fff; padding: 20px; padding-top: calc(20px + env(safe-area-inset-top)); }

    h1 { margin-bottom: 8px; font-size: 28px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 16px; }
    .tab { flex: 1; padding: 10px; font-size: 16px; background: #161b22; color: #fff;
           border: none; border-radius: 10px; cursor: pointer; }
    .tab.active { background: #2ea043; }

    /* Summary button */
    .summary-btn {
      width: 100%; background: #161b22; color: #fff; border: none;
      border-radius: 12px; padding: 16px; margin-bottom: 10px;
      text-align: center; cursor: pointer;
    }
    .summary-btn .period-label { display: block; font-size: 14px; opacity: 0.7; margin-bottom: 4px; }
    .summary-btn .big-amount { font-size: 30px; font-weight: bold; }
    .summary-btn .hint { display: block; font-size: 11px; opacity: 0.45; margin-top: 6px; }

    .day-status {
      text-align: center; font-size: 13px; margin-bottom: 12px;
      padding: 8px; border-radius: 8px; background: #161b22;
    }
    .day-status.open { color: #7ee787; }
    .day-status.stale { color: #e3b341; }
    .day-status.closed { color: #8b949e; }

    /* Slide to End Day */
    .slide-container {
      width: 100%; background: #2b3a4a; border-radius: 25px; padding: 4px;
      margin-bottom: 14px; user-select: none; -webkit-user-select: none; touch-action: none;
    }
    .slide-container.disabled { opacity: 0.4; }
    .slide-track { position: relative; height: 50px; background: #1e2a36; border-radius: 25px; overflow: hidden; }
    .slide-handle {
      position: absolute; left: 4px; top: 50%; transform: translateY(-50%);
      width: 42px; height: 42px; background: #f85149; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: #fff; pointer-events: none; transition: left 0.15s ease-out;
    }
    .slide-track.dragging .slide-handle { transition: none; }
    .slide-text {
      position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
      text-align: center; color: rgba(255,255,255,0.7); font-size: 16px; pointer-events: none;
    }
    .slide-track.completed .slide-handle { background: #2ea043; }
    .slide-track.completed .slide-text { color: #fff; }

    .entry-form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .entry-form input, .entry-form select { flex: 1 1 auto; padding: 12px; font-size: 16px;
      border-radius: 10px; border: none; background: #fff; color: #000; min-width: 0; }
    .entry-form button { padding: 12px 18px; font-size: 16px; border: none; border-radius: 10px;
      background: #2ea043; color: #fff; }
    .entry-form #cancelEditBtn { background: #f85149; display: none; }

    .custom-source-row { display: flex; gap: 8px; margin-top: -8px; margin-bottom: 8px; }
    .custom-source-row input { flex: 1; padding: 10px; font-size: 16px; border-radius: 8px; border: none; }
    .custom-source-row button { padding: 10px 16px; border: none; border-radius: 8px; background: #2ea043; color: #fff; }

    ul { list-style: none; }
    li { background: #161b22; padding: 12px; border-radius: 10px; margin-bottom: 8px;
         display: flex; align-items: center; gap: 8px; }
    li .info { flex: 1; }
    li .amount { font-size: 18px; font-weight: bold; }
    li .source-date { font-size: 13px; opacity: 0.7; }
    li .actions button { background: none; border: none; color: #f85149; font-size: 16px; padding: 4px; }
    li .actions button.edit { color: #58a6ff; }

    /* Toast */
    #toast {
      position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
      background: #2ea043; color: #fff; padding: 12px 20px; border-radius: 10px;
      font-size: 15px; opacity: 0; pointer-events: none; transition: opacity 0.25s;
      max-width: 90%; text-align: center; z-index: 999;
    }
    #toast.show { opacity: 1; }

    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>💰 Budget</h1>

  <div class="tabs">
    <button class="tab active" id="earningsTabBtn" onclick="showTab('earnings')">Earnings</button>
    <button class="tab" id="expensesTabBtn" onclick="showTab('expenses')">Expenses</button>
  </div>

  <div id="earningsSection">
    <button class="summary-btn" id="summaryBtn">
      <span class="period-label" id="summaryPeriodLabel">Day Total</span>
      <span class="big-amount">$<span id="summaryAmount">0.00</span></span>
      <span class="hint">tap to switch: day → week → month</span>
    </button>

    <div class="day-status open" id="dayStatus">Active day: Today</div>

    <div class="slide-container" id="slideContainer">
      <div class="slide-track" id="slideTrack">
        <span class="slide-text" id="slideText">Slide to End Day</span>
        <div class="slide-handle" id="slideHandle">🛑</div>
      </div>
    </div>

    <div class="entry-form">
      <input type="number" id="amountInput" placeholder="Amount" step="0.01" min="0" inputmode="decimal">
      <select id="sourceSelect">
        <option value="UberEats">UberEats</option>
        <option value="DoorDash">DoorDash</option>
        <option value="__custom__">+ Add custom…</option>
      </select>
      <button id="addBtn">Add</button>
      <button id="cancelEditBtn">Cancel</button>
    </div>

    <div id="customSourceRow" class="custom-source-row hidden">
      <input type="text" id="customSourceInput" placeholder="New source name">
      <button onclick="addCustomSource()">Save</button>
    </div>

    <ul id="earningsList"></ul>
  </div>

  <div id="expensesSection" class="hidden">
    <p>Expenses tab coming soon.</p>
  </div>

  <div id="toast"></div>

  <script>
    // ------------------------ Data ------------------------
    let earnings = JSON.parse(localStorage.getItem('earnings') || '[]');
    let customSources = JSON.parse(localStorage.getItem('customSources') || '[]');

    // currentDay = the day entries are tagged with (or the last day used, if closed)
    let currentDay = localStorage.getItem('currentDay')
                  || localStorage.getItem('activeDay')   // migrate from old version
                  || getTodayString();

    // dayOpen = true means entries go to currentDay. false means next entry starts a fresh day.
    let storedOpen = localStorage.getItem('dayOpen');
    let dayOpen = (storedOpen === null) ? true : (storedOpen === 'true');

    let editingId = null;
    let summaryMode = 'day';

    // ------------------- Helpers -------------------
    function getTodayString() {
      const n = new Date();
      return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
    }

    function saveData() {
      localStorage.setItem('earnings', JSON.stringify(earnings));
      localStorage.setItem('customSources', JSON.stringify(customSources));
      localStorage.setItem('currentDay', currentDay);
      localStorage.setItem('dayOpen', dayOpen ? 'true' : 'false');
    }

    function formatCurrency(n) { return Number(n).toFixed(2); }

    function toDate(dateStr) {
      const p = dateStr.split('-');
      return new Date(p[0], p[1] - 1, p[2]);
    }

    function getStartOfWeek(dateStr) {
      const d = toDate(dateStr);
      const day = d.getDay();                          // 0 = Sunday
      d.setDate(d.getDate() - day + (day === 0 ? -6 : 1)); // Monday start
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function isSameWeek(a, b) { return getStartOfWeek(a) === getStartOfWeek(b); }
    function isSameMonth(a, b) { return a.substring(0,7) === b.substring(0,7); }

    function getReadableDate(dateStr) {
      return toDate(dateStr).toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove('show'), 2600);
    }

    // -------------------- UI --------------------
    function updateSummary() {
      const labelEl = document.getElementById('summaryPeriodLabel');
      const amountEl = document.getElementById('summaryAmount');
      let total = 0, label = '';

      if (summaryMode === 'day') {
        total = earnings.filter(e => e.date === currentDay)
                        .reduce((s,e) => s + (parseFloat(e.amount)||0), 0);
        label = dayOpen ? 'Day Total' : 'Last Day Total';
      } else if (summaryMode === 'week') {
        total = earnings.filter(e => isSameWeek(e.date, currentDay))
                        .reduce((s,e) => s + (parseFloat(e.amount)||0), 0);
        label = 'Week Total';
      } else {
        total = earnings.filter(e => isSameMonth(e.date, currentDay))
                        .reduce((s,e) => s + (parseFloat(e.amount)||0), 0);
        label = 'Month Total';
      }

      labelEl.textContent = label;
      amountEl.textContent = formatCurrency(total);
    }

    function updateDayStatus() {
      const el = document.getElementById('dayStatus');
      el.classList.remove('open','stale','closed');

      if (!dayOpen) {
        el.classList.add('closed');
        el.textContent = `Day closed (${getReadableDate(currentDay)}) — next entry starts a new day`;
      } else if (currentDay === getTodayString()) {
        el.classList.add('open');
        el.textContent = 'Active day: Today';
      } else {
        el.classList.add('stale');
        el.textContent = `⚠️ Still on ${getReadableDate(currentDay)} — entries go here until you end the day`;
      }
      updateSlideState();
    }

    function updateSlideState() {
      const container = document.getElementById('slideContainer');
      const text = document.getElementById('slideText');
      if (dayOpen) {
        container.classList.remove('disabled');
        text.textContent = 'Slide to End Day';
      } else {
        container.classList.add('disabled');
        text.textContent = 'Day already closed';
      }
    }

    function renderEarningsList() {
      const list = document.getElementById('earningsList');
      list.innerHTML = '';

      const sorted = [...earnings].sort((a,b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));

      sorted.forEach(e => {
        const li = document.createElement('li');
        li.innerHTML = `
          <div class="info">
            <div class="amount">$${formatCurrency(e.amount)}</div>
            <div class="source-date">${e.source} · ${getReadableDate(e.date)}</div>
          </div>
          <div class="actions">
            <button class="edit" onclick="startEdit('${e.id}')">✏️</button>
            <button onclick="deleteEarning('${e.id}')">🗑️</button>
          </div>`;
        list.appendChild(li);
      });

      if (earnings.length === 0) {
        list.innerHTML = '<li style="opacity:0.6;">No earnings added yet.</li>';
      }
    }

    function updateSourceSelect() {
      const select = document.getElementById('sourceSelect');
      const current = select.value;
      while (select.options.length > 3) select.remove(3);

      customSources.forEach(src => {
        const opt = document.createElement('option');
        opt.value = src; opt.textContent = src;
        select.add(opt);
      });

      if (current && [...select.options].some(o => o.value === current)) select.value = current;
      else select.value = 'UberEats';

      document.getElementById('customSourceRow')
              .classList.toggle('hidden', select.value !== '__custom__');
    }

    function showTab(tab) {
      const eS = document.getElementById('earningsSection');
      const xS = document.getElementById('expensesSection');
      const eB = document.getElementById('earningsTabBtn');
      const xB = document.getElementById('expensesTabBtn');
      if (tab === 'earnings') {
        eS.classList.remove('hidden'); xS.classList.add('hidden');
        eB.classList.add('active'); xB.classList.remove('active');
      } else {
        eS.classList.add('hidden'); xS.classList.remove('hidden');
        xB.classList.add('active'); eB.classList.remove('active');
      }
    }

    // -------------------- Actions --------------------
    function endDay() {
      if (!dayOpen) { showToast('Day is already closed'); return; }
      dayOpen = false;
      saveData();
      updateDayStatus();
      updateSummary();
      showToast(`Day closed. Next entry starts a new day.`);
    }

    function addOrUpdateEarning() {
      const amountInput = document.getElementById('amountInput');
      const sourceSelect = document.getElementById('sourceSelect');
      const amount = parseFloat(amountInput.value);
      const source = sourceSelect.value;

      if (!amount || amount <= 0) { alert('Please enter a valid amount.'); return; }
      if (source === '__custom__') { alert('Please pick a source or save your custom one first.'); return; }

      if (editingId) {
        const i = earnings.findIndex(e => e.id === editingId);
        if (i !== -1) { earnings[i].amount = amount; earnings[i].source = source; }
        editingId = null;
        document.getElementById('addBtn').textContent = 'Add';
        document.getElementById('cancelEditBtn').style.display = 'none';
      } else {
        // If the day is closed, this entry opens a brand new day using the real date
        if (!dayOpen) {
          currentDay = getTodayString();
          dayOpen = true;
          showToast('New day started: ' + getReadableDate(currentDay));
        }
        earnings.push({
          id: Date.now().toString() + Math.random().toString(36).substr(2,5),
          amount, source,
          date: currentDay
        });
      }

      amountInput.value = '';
      sourceSelect.value = 'UberEats';
      updateSourceSelect();

      saveData();
      updateDayStatus();
      updateSummary();
      renderEarningsList();
    }

    function startEdit(id) {
      const entry = earnings.find(e => e.id === id);
      if (!entry) return;
      editingId = id;
      document.getElementById('amountInput').value = entry.amount;
      document.getElementById('sourceSelect').value = entry.source;
      updateSourceSelect();
      document.getElementById('addBtn').textContent = 'Update';
      document.getElementById('cancelEditBtn').style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
      editingId = null;
      document.getElementById('amountInput').value = '';
      document.getElementById('sourceSelect').value = 'UberEats';
      document.getElementById('addBtn').textContent = 'Add';
      document.getElementById('cancelEditBtn').style.display = 'none';
      updateSourceSelect();
    }

    function deleteEarning(id) {
      if (!confirm('Delete this entry?')) return;
      earnings = earnings.filter(e => e.id !== id);
      if (editingId === id) cancelEdit();
      saveData();
      updateSummary();
      renderEarningsList();
    }

    function addCustomSource() {
      const input = document.getElementById('customSourceInput');
      const name = input.value.trim();
      if (!name) return;
      if (!customSources.includes(name)) { customSources.push(name); saveData(); }
      updateSourceSelect();
      document.getElementById('sourceSelect').value = name;
      input.value = '';
      updateSourceSelect();
    }

    function cycleSummaryMode() {
      const modes = ['day','week','month'];
      summaryMode = modes[(modes.indexOf(summaryMode) + 1) % modes.length];
      updateSummary();
    }

    // -------------------- Slide to End Day --------------------
    let isDragging = false, handleLeft = 4;
    const slideTrack = document.getElementById('slideTrack');
    const slideHandle = document.getElementById('slideHandle');
    const slideText = document.getElementById('slideText');

    function maxLeft() {
      return slideTrack.getBoundingClientRect().width - 4 - slideHandle.offsetWidth;
    }

    function resetSlide() {
      isDragging = false;
      handleLeft = 4;
      slideHandle.style.left = '4px';
      slideTrack.classList.remove('completed','dragging');
      updateSlideState();
    }

    slideTrack.addEventListener('pointerdown', e => {
      if (!dayOpen) return;
      isDragging = true;
      slideTrack.classList.add('dragging');
      slideTrack.setPointerCapture(e.pointerId);
    });

    slideTrack.addEventListener('pointermove', e => {
      if (!isDragging) return;
      const rect = slideTrack.getBoundingClientRect();
      let left = e.clientX - rect.left - slideHandle.offsetWidth / 2;
      left = Math.max(4, Math.min(maxLeft(), left));
      handleLeft = left;
      slideHandle.style.left = left + 'px';

      if (left >= maxLeft() * 0.92) {
        slideTrack.classList.add('completed');
        slideText.textContent = 'Release to end day';
      } else {
        slideTrack.classList.remove('completed');
        slideText.textContent = 'Slide to End Day';
      }
    });

    function finishSlide() {
      if (!isDragging) return;
      const done = handleLeft >= maxLeft() * 0.92;
      resetSlide();
      if (done) endDay();
    }

    slideTrack.addEventListener('pointerup', finishSlide);
    slideTrack.addEventListener('pointercancel', finishSlide);

    // -------------------- Listeners --------------------
    document.getElementById('addBtn').addEventListener('click', addOrUpdateEarning);
    document.getElementById('cancelEditBtn').addEventListener('click', cancelEdit);
    document.getElementById('sourceSelect').addEventListener('change', updateSourceSelect);
    document.getElementById('amountInput').addEventListener('keydown', e => { if (e.key === 'Enter') addOrUpdateEarning(); });
    document.getElementById('customSourceInput').addEventListener('keydown', e => { if (e.key === 'Enter') addCustomSource(); });
    document.getElementById('summaryBtn').addEventListener('click', cycleSummaryMode);

    // -------------------- Init --------------------
    updateSourceSelect();
    updateDayStatus();
    updateSummary();
    renderEarningsList();
    resetSlide();
  </script>
</body>
</html>
