<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Budget App</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Budget">
  <meta name="theme-color" content="#0d1117">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
    body { background: #0d1117; color: #fff; padding: 20px; padding-top: calc(20px + env(safe-area-inset-top)); }

    h1 { margin-bottom: 8px; font-size: 28px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 16px; }
    .tab { flex: 1; padding: 10px; font-size: 16px; background: #161b22; color: #fff;
           border: none; border-radius: 10px; cursor: pointer; }
    .tab.active { background: #2ea043; }

    /* Summary button */
    .summary-btn {
      width: 100%;
      background: #161b22;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      text-align: center;
      cursor: pointer;
    }
    .summary-btn .period-label {
      display: block;
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 4px;
    }
    .summary-btn .big-amount {
      font-size: 28px;
      font-weight: bold;
    }

    .active-day-label {
      text-align: center;
      font-size: 13px;
      opacity: 0.8;
      margin-bottom: 12px;
    }

    .entry-form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .entry-form input, .entry-form select { flex: 1 1 auto; padding: 12px; font-size: 16px;
      border-radius: 10px; border: none; background: #fff; color: #000; min-width: 0; }
    .entry-form button { padding: 12px 18px; font-size: 16px; border: none; border-radius: 10px;
      background: #2ea043; color: #fff; }
    .entry-form #cancelEditBtn { background: #f85149; display: none; }

    .custom-source-row { display: flex; gap: 8px; margin-top: -8px; margin-bottom: 8px; }
    .custom-source-row input { flex: 1; padding: 10px; font-size: 16px; border-radius: 8px; border: none; }

    .end-day-btn {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: #2b3a4a;
      color: #fff;
      margin-bottom: 12px;
      cursor: pointer;
    }
    .end-day-btn:hover { background: #3a4d60; }

    ul { list-style: none; }
    li { background: #161b22; padding: 12px; border-radius: 10px; margin-bottom: 8px;
         display: flex; align-items: center; gap: 8px; }
    li .info { flex: 1; }
    li .amount { font-size: 18px; font-weight: bold; }
    li .source-date { font-size: 13px; opacity: 0.7; }
    li .actions button { background: none; border: none; color: #f85149; font-size: 16px; padding: 4px; }
    li .actions button.edit { color: #58a6ff; }

    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>💰 Budget</h1>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" id="earningsTabBtn" onclick="showTab('earnings')">Earnings</button>
    <button class="tab" id="expensesTabBtn" onclick="showTab('expenses')">Expenses</button>
  </div>

  <!-- Earnings Section -->
  <div id="earningsSection">
    <!-- Summary button (cycles Day / Week / Month) -->
    <button class="summary-btn" id="summaryBtn">
      <span class="period-label" id="summaryPeriodLabel">Day Total</span>
      <span class="big-amount">$<span id="summaryAmount">0.00</span></span>
    </button>

    <div class="active-day-label" id="activeDayLabel">Active day: Today</div>

    <button class="end-day-btn" onclick="endDay()">🛑 End Day</button>

    <div class="entry-form">
      <input type="number" id="amountInput" placeholder="Amount" step="0.01" min="0" inputmode="decimal">
      <select id="sourceSelect">
        <option value="UberEats">UberEats</option>
        <option value="DoorDash">DoorDash</option>
        <option value="__custom__">+ Add custom…</option>
      </select>
      <button id="addBtn">Add</button>
      <button id="cancelEditBtn">Cancel</button>
    </div>

    <div id="customSourceRow" class="custom-source-row hidden">
      <input type="text" id="customSourceInput" placeholder="New source name">
      <button onclick="addCustomSource()">Save</button>
    </div>

    <ul id="earningsList"></ul>
  </div>

  <!-- Expenses Section (placeholder) -->
  <div id="expensesSection" class="hidden">
    <p>Expenses tab coming soon.</p>
  </div>

  <script>
    // ------------------------ Data ------------------------
    let earnings = JSON.parse(localStorage.getItem('earnings') || '[]');
    let customSources = JSON.parse(localStorage.getItem('customSources') || '[]');
    // Active day – stored as 'YYYY-MM-DD' string
    let activeDay = localStorage.getItem('activeDay') || getTodayString();
    let editingId = null;          // id of entry being edited, null if adding new
    let summaryMode = 'day';       // 'day', 'week', 'month'

    // ------------------- Helper Functions -------------------
    function getTodayString() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function saveData() {
      localStorage.setItem('earnings', JSON.stringify(earnings));
      localStorage.setItem('customSources', JSON.stringify(customSources));
      localStorage.setItem('activeDay', activeDay);
    }

    function formatCurrency(num) {
      return Number(num).toFixed(2);
    }

    function getStartOfWeek(dateStr) {
      const parts = dateStr.split('-');
      const date = new Date(parts[0], parts[1] - 1, parts[2]);
      const day = date.getDay(); // 0 = Sunday
      const diff = date.getDate() - day + (day === 0 ? -6 : 1); // Monday start
      date.setDate(diff);
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getMonthKey(dateStr) {
      // returns 'YYYY-MM'
      return dateStr.substring(0, 7);
    }

    function isSameWeek(dateStr, refDateStr) {
      return getStartOfWeek(dateStr) === getStartOfWeek(refDateStr);
    }

    function isSameMonth(dateStr, refDateStr) {
      return getMonthKey(dateStr) === getMonthKey(refDateStr);
    }

    function getReadableDate(dateStr) {
      const parts = dateStr.split('-');
      const date = new Date(parts[0], parts[1] - 1, parts[2]);
      return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    function getActiveDayLabel() {
      if (activeDay === getTodayString()) return 'Today';
      const parts = activeDay.split('-');
      const date = new Date(parts[0], parts[1] - 1, parts[2]);
      return date.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    }

    // -------------------- UI Updates --------------------
    function updateSummary() {
      const labelEl = document.getElementById('summaryPeriodLabel');
      const amountEl = document.getElementById('summaryAmount');

      let total = 0;
      if (summaryMode === 'day') {
        total = earnings.filter(e => e.date === activeDay).reduce((sum, e) => sum + (parseFloat(e.amount) || 0), 0);
        labelEl.textContent = 'Day Total';
      } else if (summaryMode === 'week') {
        total = earnings.filter(e => isSameWeek(e.date, activeDay)).reduce((sum, e) => sum + (parseFloat(e.amount) || 0), 0);
        labelEl.textContent = 'Week Total';
      } else if (summaryMode === 'month') {
        total = earnings.filter(e => isSameMonth(e.date, activeDay)).reduce((sum, e) => sum + (parseFloat(e.amount) || 0), 0);
        labelEl.textContent = 'Month Total';
      }

      amountEl.textContent = formatCurrency(total);
    }

    function updateActiveDayLabel() {
      document.getElementById('activeDayLabel').textContent = `Active day: ${getActiveDayLabel()}`;
    }

    function renderEarningsList() {
      const list = document.getElementById('earningsList');
      list.innerHTML = '';

      // Sort newest first (by date string, descending)
      const sorted = [...earnings].sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));

      sorted.forEach(e => {
        const li = document.createElement('li');
        li.innerHTML = `
          <div class="info">
            <div class="amount">$${formatCurrency(e.amount)}</div>
            <div class="source-date">${e.source} · ${getReadableDate(e.date)}</div>
          </div>
          <div class="actions">
            <button class="edit" onclick="startEdit('${e.id}')">✏️</button>
            <button onclick="deleteEarning('${e.id}')">🗑️</button>
          </div>
        `;
        list.appendChild(li);
      });

      if (earnings.length === 0) {
        list.innerHTML = '<li style="opacity:0.6;">No earnings added yet.</li>';
      }
    }

    function updateSourceSelect() {
      const select = document.getElementById('sourceSelect');
      const currentValue = select.value;

      // Remove all options except the first three
      while (select.options.length > 3) {
        select.remove(3);
      }

      customSources.forEach(src => {
        const opt = document.createElement('option');
        opt.value = src;
        opt.textContent = src;
        select.add(opt);
      });

      if (currentValue && [...select.options].some(o => o.value === currentValue)) {
        select.value = currentValue;
      } else {
        select.value = 'UberEats';
      }

      const customRow = document.getElementById('customSourceRow');
      if (select.value === '__custom__') {
        customRow.classList.remove('hidden');
      } else {
        customRow.classList.add('hidden');
      }
    }

    function showTab(tab) {
      const earningsSection = document.getElementById('earningsSection');
      const expensesSection = document.getElementById('expensesSection');
      const earnTab = document.getElementById('earningsTabBtn');
      const expTab = document.getElementById('expensesTabBtn');

      if (tab === 'earnings') {
        earningsSection.classList.remove('hidden');
        expensesSection.classList.add('hidden');
        earnTab.classList.add('active');
        expTab.classList.remove('active');
      } else {
        earningsSection.classList.add('hidden');
        expensesSection.classList.remove('hidden');
        expTab.classList.add('active');
        earnTab.classList.remove('active');
      }
    }

    // -------------------- Actions --------------------
    function addOrUpdateEarning() {
      const amountInput = document.getElementById('amountInput');
      const sourceSelect = document.getElementById('sourceSelect');
      const amount = parseFloat(amountInput.value);
      const source = sourceSelect.value;

      if (!amount || amount <= 0) {
        alert('Please enter a valid amount.');
        return;
      }
      if (source === '__custom__') {
        alert('Please select a source or add a custom one.');
        return;
      }

      if (editingId) {
        const index = earnings.findIndex(e => e.id === editingId);
        if (index !== -1) {
          earnings[index].amount = amount;
          earnings[index].source = source;
        }
        editingId = null;
        document.getElementById('addBtn').textContent = 'Add';
        document.getElementById('cancelEditBtn').style.display = 'none';
      } else {
        earnings.push({
          id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
          amount: amount,
          source: source,
          date: activeDay   // <-- using activeDay, not the actual current date
        });
      }

      amountInput.value = '';
      sourceSelect.value = 'UberEats';
      updateSourceSelect();

      saveData();
      updateSummary();
      renderEarningsList();
    }

    function startEdit(id) {
      const entry = earnings.find(e => e.id === id);
      if (!entry) return;

      editingId = id;
      document.getElementById('amountInput').value = entry.amount;
      document.getElementById('sourceSelect').value = entry.source;
      updateSourceSelect();

      document.getElementById('addBtn').textContent = 'Update';
      document.getElementById('cancelEditBtn').style.display = 'inline-block';
    }

    function cancelEdit() {
      editingId = null;
      document.getElementById('amountInput').value = '';
      document.getElementById('sourceSelect').value = 'UberEats';
      document.getElementById('addBtn').textContent = 'Add';
      document.getElementById('cancelEditBtn').style.display = 'none';
      updateSourceSelect();
    }

    function deleteEarning(id) {
      if (!confirm('Delete this entry?')) return;
      earnings = earnings.filter(e => e.id !== id);
      if (editingId === id) cancelEdit();
      saveData();
      updateSummary();
      renderEarningsList();
    }

    function addCustomSource() {
      const input = document.getElementById('customSourceInput');
      const name = input.value.trim();
      if (!name) return;

      if (!customSources.includes(name)) {
        customSources.push(name);
        saveData();
        updateSourceSelect();
      }

      document.getElementById('sourceSelect').value = name;
      input.value = '';
      updateSourceSelect();
    }

    function endDay() {
      // Set activeDay to today's date
      activeDay = getTodayString();
      saveData();
      updateActiveDayLabel();
      updateSummary();
      // Optional: show a confirmation
      alert('Day ended. New entries will go to today: ' + getActiveDayLabel());
    }

    // Cycle summary mode
    function cycleSummaryMode() {
      const modes = ['day', 'week', 'month'];
      const currentIndex = modes.indexOf(summaryMode);
      summaryMode = modes[(currentIndex + 1) % modes.length];
      updateSummary();
    }

    // -------------------- Event Listeners --------------------
    document.getElementById('addBtn').addEventListener('click', addOrUpdateEarning);
    document.getElementById('cancelEditBtn').addEventListener('click', cancelEdit);
    document.getElementById('sourceSelect').addEventListener('change', updateSourceSelect);
    document.getElementById('amountInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addOrUpdateEarning();
    });
    document.getElementById('customSourceInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addCustomSource();
    });
    document.getElementById('summaryBtn').addEventListener('click', cycleSummaryMode);

    // Initial render
    updateSourceSelect();
    updateActiveDayLabel();
    updateSummary();
    renderEarningsList();
  </script>
</body>
</html>
