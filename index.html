<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Budget App</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Budget">
  <meta name="theme-color" content="#0d1117">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
    body { background: #0d1117; color: #fff; padding: 20px; padding-top: calc(20px + env(safe-area-inset-top)); }

    h1 { margin-bottom: 8px; font-size: 28px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 16px; }
    .tab { flex: 1; padding: 10px; font-size: 16px; background: #161b22; color: #fff;
           border: none; border-radius: 10px; cursor: pointer; }
    .tab.active { background: #2ea043; }

    /* Summary button (Earnings) */
    .summary-btn {
      width: 100%; background: #161b22; color: #fff; border: none;
      border-radius: 12px; padding: 16px; margin-bottom: 10px;
      text-align: center; cursor: pointer;
    }
    .summary-btn .period-label { display: block; font-size: 14px; opacity: 0.7; margin-bottom: 4px; }
    .summary-btn .big-amount { font-size: 30px; font-weight: bold; }
    .summary-btn .hint { display: block; font-size: 11px; opacity: 0.45; margin-top: 6px; }

    .day-status {
      text-align: center; font-size: 13px; margin-bottom: 12px;
      padding: 8px; border-radius: 8px; background: #161b22;
    }
    .day-status.open { color: #7ee787; }
    .day-status.stale { color: #e3b341; }
    .day-status.closed { color: #8b949e; }

    /* Slide to End Day (Earnings) */
    .slide-container {
      width: 100%; background: #2b3a4a; border-radius: 25px; padding: 4px;
      margin-bottom: 14px; user-select: none; -webkit-user-select: none; touch-action: none;
    }
    .slide-container.disabled { opacity: 0.4; }
    .slide-track { position: relative; height: 50px; background: #1e2a36; border-radius: 25px; overflow: hidden; }
    .slide-handle {
      position: absolute; left: 4px; top: 50%; transform: translateY(-50%);
      width: 42px; height: 42px; background: #f85149; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: #fff; pointer-events: none; transition: left 0.15s ease-out;
    }
    .slide-track.dragging .slide-handle { transition: none; }
    .slide-text {
      position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
      text-align: center; color: rgba(255,255,255,0.7); font-size: 16px; pointer-events: none;
    }
    .slide-track.completed .slide-handle { background: #2ea043; }
    .slide-track.completed .slide-text { color: #fff; }

    /* Month Selector */
    .month-header { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; }
    .month-display {
      flex: 1; background: #161b22; padding: 14px; border-radius: 10px;
      text-align: center; font-size: 18px; font-weight: bold; cursor: pointer;
    }
    .ytd-btn {
      padding: 14px 20px; background: #1f6feb; border: none; border-radius: 10px;
      color: #fff; font-size: 16px; font-weight: bold;
    }
    .ytd-btn.active { background: #2ea043; }
    .month-dropdown {
      position: absolute; top: 70px; left: 20px; right: 20px; background: #161b22;
      border-radius: 10px; padding: 10px; display: none; z-index: 100;
      max-height: 300px; overflow-y: auto;
    }
    .month-dropdown.show { display: block; }
    .month-option {
      padding: 12px; border-radius: 8px; cursor: pointer;
    }
    .month-option:hover { background: #2ea043; }
    .month-option.selected { background: #1f6feb; }

    /* Outstanding Balance - BIG */
    .balance-card {
      background: linear-gradient(135deg, #1f6feb 0%, #0d1117 100%);
      border-radius: 12px; padding: 20px; margin-bottom: 16px;
      text-align: center; border: 2px solid #1f6feb;
    }
    .balance-label { font-size: 14px; opacity: 0.8; margin-bottom: 8px; }
    .balance-amount { font-size: 42px; font-weight: bold; margin-bottom: 8px; }
    .balance-who { font-size: 18px; opacity: 0.9; }
    .balance-who.positive { color: #f85149; }
    .balance-who.negative { color: #7ee787; }

    /* Payment Slider */
    .payment-slider-container {
      width: 100%; background: #2b3a4a; border-radius: 25px; padding: 4px;
      margin-bottom: 16px; user-select: none; -webkit-user-select: none; touch-action: none;
    }
    .payment-slider-track { position: relative; height: 50px; background: #1e2a36; border-radius: 25px; overflow: hidden; }
    .payment-slider-handle {
      position: absolute; left: 4px; top: 50%; transform: translateY(-50%);
      width: 42px; height: 42px; background: #1f6feb; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: #fff; pointer-events: none; transition: left 0.15s ease-out;
    }
    .payment-slider-track.dragging .payment-slider-handle { transition: none; }
    .payment-slider-text {
      position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
      text-align: center; color: rgba(255,255,255,0.7); font-size: 16px; pointer-events: none;
    }
    .payment-slider-track.completed .payment-slider-handle { background: #2ea043; }
    .payment-slider-track.completed .payment-slider-text { color: #fff; }

    /* Work Total Card */
    .work-card { background: #161b22; border-radius: 10px; padding: 14px; margin-bottom: 16px; cursor: pointer; }
    .work-card-title { font-size: 13px; opacity: 0.7; margin-bottom: 6px; }
    .work-card-value { font-size: 22px; font-weight: bold; }
    .breakdown { margin-top: 10px; padding-top: 10px; border-top: 1px solid #30363d; display: none; }
    .breakdown.show { display: block; }
    .breakdown-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }

    /* Type Toggle */
    .type-toggle { display: flex; background: #161b22; border-radius: 10px; padding: 4px; margin-bottom: 12px; }
    .type-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; background: transparent; color: #8b949e; cursor: pointer; }
    .type-btn.active { background: #2ea043; color: #fff; }

    /* Entry Form */
    .entry-form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .entry-form input, .entry-form select { flex: 1 1 auto; padding: 12px; font-size: 16px;
      border-radius: 10px; border: none; background: #fff; color: #000; min-width: 0; }
    .entry-form button { padding: 12px 18px; font-size: 16px; border: none; border-radius: 10px;
      background: #2ea043; color: #fff; }
    .entry-form #cancelEditBtn { background: #f85149; display: none; }

    .custom-row { display: flex; gap: 8px; margin-top: -8px; margin-bottom: 8px; }
    .custom-row input { flex: 1; padding: 10px; font-size: 16px; border-radius: 8px; border: none; }
    .custom-row button { padding: 10px 16px; border: none; border-radius: 8px; background: #2ea043; color: #fff; }

    /* Lists - Side by Side */
    .lists-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .list-column { background: #161b22; border-radius: 10px; padding: 12px; max-height: 400px; overflow-y: auto; }
    .list-header { font-size: 14px; font-weight: bold; opacity: 0.8; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #30363d; }
    
    ul { list-style: none; }
    li { background: #0d1117; padding: 10px; border-radius: 8px; margin-bottom: 6px; font-size: 13px; }
    li .amount { font-size: 16px; font-weight: bold; color: #7ee787; }
    li .meta { font-size: 11px; opacity: 0.7; margin-top: 4px; }
    li .actions { display: flex; gap: 4px; margin-top: 6px; }
    li .actions button { background: none; border: none; font-size: 14px; padding: 2px; }
    li .actions button.edit { color: #58a6ff; }
    li .actions button.delete { color: #f85149; }

    /* Toast */
    #toast {
      position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
      background: #2ea043; color: #fff; padding: 12px 20px; border-radius: 10px;
      font-size: 15px; opacity: 0; pointer-events: none; transition: opacity 0.25s;
      max-width: 90%; text-align: center; z-index: 999;
    }
    #toast.show { opacity: 1; }

    .hidden { display: none; }
    .section { margin-bottom: 12px; }
  </style>
</head>
<body>
  <h1>💰 Budget</h1>

  <div class="tabs">
    <button class="tab active" id="earningsTabBtn" onclick="showMainTab('earnings')">Earnings</button>
    <button class="tab" id="expensesTabBtn" onclick="showMainTab('expenses')">Expenses</button>
  </div>

  <!-- EARNINGS SECTION -->
  <div id="earningsSection">
    <button class="summary-btn" id="summaryBtn">
      <span class="period-label" id="summaryPeriodLabel">Day Total</span>
      <span class="big-amount">$<span id="summaryAmount">0.00</span></span>
      <span class="hint">tap to switch: day → week → month</span>
    </button>

    <div class="day-status open" id="dayStatus">Active day: Today</div>

    <div class="slide-container" id="slideContainer">
      <div class="slide-track" id="slideTrack">
        <span class="slide-text" id="slideText">Slide to End Day</span>
        <div class="slide-handle" id="slideHandle">🛑</div>
      </div>
    </div>

    <div class="entry-form">
      <input type="number" id="earningsAmountInput" placeholder="Amount" step="0.01" min="0" inputmode="decimal">
      <select id="earningsSourceSelect">
        <option value="UberEats">UberEats</option>
        <option value="DoorDash">DoorDash</option>
        <option value="__custom__">+ Add custom…</option>
      </select>
      <button id="earningsAddBtn">Add</button>
      <button id="earningsCancelBtn">Cancel</button>
    </div>

    <div id="earningsCustomRow" class="custom-row hidden">
      <input type="text" id="earningsCustomInput" placeholder="New source name">
      <button onclick="addCustomSource()">Save</button>
    </div>

    <ul id="earningsList"></ul>
  </div>

  <!-- EXPENSES SECTION -->
  <div id="expensesSection" class="hidden">
    
    <!-- Month Header -->
    <div class="month-header">
      <div class="month-display" id="monthDisplay" onclick="toggleMonthDropdown()">August 2025 ▼</div>
      <button class="ytd-btn" id="ytdBtn" onclick="selectYTD()">YTD</button>
    </div>
    <div class="month-dropdown" id="monthDropdown"></div>

    <!-- Outstanding Balance -->
    <div class="balance-card">
      <div class="balance-label" id="balanceLabel">Gian owes Abhi</div>
      <div class="balance-amount" id="balanceAmount">$0.00</div>
      <div class="balance-who" id="balanceWho"></div>
    </div>

    <!-- Payment Slider -->
    <div class="payment-slider-container" id="paymentSliderContainer">
      <div class="payment-slider-track" id="paymentSliderTrack">
        <span class="payment-slider-text" id="paymentSliderText">Slide to Record Payment</span>
        <div class="payment-slider-handle" id="paymentSliderHandle">💰</div>
      </div>
    </div>

    <!-- Work Total Card -->
    <div class="work-card" onclick="toggleWorkBreakdown()">
      <div class="work-card-title">Work Expenses (<span id="workMonthLabel">This Month</span>)</div>
      <div class="work-card-value" id="workTotalDisplay">$0.00</div>
      <div id="workBreakdown" class="breakdown"></div>
    </div>

    <!-- Type Toggle -->
    <div class="type-toggle">
      <button class="type-btn active" id="typePersonalBtn" onclick="setExpenseType('personal')">Personal</button>
      <button class="type-btn" id="typeWorkBtn" onclick="setExpenseType('work')">Work</button>
    </div>

    <!-- Entry Form -->
    <div class="entry-form">
      <input type="date" id="expenseDateInput">
      <input type="number" id="expenseAmountInput" placeholder="Amount (CAD)" step="0.01" min="0" inputmode="decimal">
      <select id="expenseCategorySelect" onchange="handleCategoryChange()"></select>
      <button id="expenseAddBtn">Add</button>
      <button id="expenseCancelBtn">Cancel</button>
    </div>

    <!-- Personal Fields -->
    <div id="personalFields" class="section">
      <div class="entry-form">
        <select id="personalPaidBySelect">
          <option value="Abhi">Abhi</option>
          <option value="Gian">Gian</option>
        </select>
        <select id="personalShareSelect" onchange="handleShareChange()">
          <option value="100">100% (full owed)</option>
          <option value="50">50% (split)</option>
          <option value="__custom__">Custom %</option>
        </select>
      </div>
      <div id="personalCustomShareRow" class="custom-row hidden">
        <input type="number" id="personalCustomShareInput" placeholder="%" step="1" min="0" max="100">
        <button onclick="setCustomShare()">Set</button>
      </div>
      <div id="personalCustomCatRow" class="custom-row hidden">
        <input type="text" id="personalCustomCatInput" placeholder="New category">
        <button onclick="addCustomPersonalCat()">Save</button>
      </div>
    </div>

    <!-- Work Fields -->
    <div id="workFields" class="section hidden">
      <div id="workCustomCatRow" class="custom-row hidden">
        <input type="text" id="workCustomCatInput" placeholder="New category">
        <button onclick="addCustomWorkCat()">Save</button>
      </div>
    </div>

    <!-- Side-by-Side Lists -->
    <div class="lists-container">
      <div class="list-column">
        <div class="list-header">PERSONAL</div>
        <ul id="personalList"></ul>
      </div>
      <div class="list-column">
        <div class="list-header">WORK</div>
        <ul id="workList"></ul>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    // ------------------------ Data ------------------------
    let earnings = JSON.parse(localStorage.getItem('earnings') || '[]');
    let customSources = JSON.parse(localStorage.getItem('customSources') || '[]');
    let currentDay = localStorage.getItem('currentDay') || localStorage.getItem('activeDay') || getTodayString();
    let storedOpen = localStorage.getItem('dayOpen');
    let dayOpen = (storedOpen === null) ? true : (storedOpen === 'true');
    let editingEarningsId = null;
    let summaryMode = 'day';

    let expenses = JSON.parse(localStorage.getItem('expenses') || '[]');
    let customPersonalCats = JSON.parse(localStorage.getItem('customPersonalCats') || '[]');
    let customWorkCats = JSON.parse(localStorage.getItem('customWorkCats') || '[]');
    let totalPaymentsRecorded = parseFloat(localStorage.getItem('totalPaymentsRecorded') || '0');
    let selectedMonth = getTodayString().substring(0, 7);
    let isYTD = false;
    let expenseType = 'personal';
    let editingExpenseId = null;
    let workBreakdownVisible = false;
    let monthDropdownOpen = false;

    // ------------------- Helpers -------------------
    function getTodayString() {
      const n = new Date();
      return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
    }

    function saveData() {
      localStorage.setItem('earnings', JSON.stringify(earnings));
      localStorage.setItem('customSources', JSON.stringify(customSources));
      localStorage.setItem('currentDay', currentDay);
      localStorage.setItem('dayOpen', dayOpen ? 'true' : 'false');
      localStorage.setItem('expenses', JSON.stringify(expenses));
      localStorage.setItem('customPersonalCats', JSON.stringify(customPersonalCats));
      localStorage.setItem('customWorkCats', JSON.stringify(customWorkCats));
      localStorage.setItem('totalPaymentsRecorded', totalPaymentsRecorded.toString());
    }

    function formatCurrency(n) { return Number(n).toFixed(2); }

    function toDate(dateStr) {
      const p = dateStr.split('-');
      return new Date(p[0], p[1] - 1, p[2]);
    }

    function getReadableDate(dateStr) {
      return toDate(dateStr).toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
    }

    function getMonthLabel(dateStr) {
      return toDate(dateStr).toLocaleDateString(undefined, { month:'long', year:'numeric' });
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove('show'), 2600);
    }

    // ------------------- Earnings Logic -------------------
    function showMainTab(tab) {
      const eS = document.getElementById('earningsSection');
      const xS = document.getElementById('expensesSection');
      const eB = document.getElementById('earningsTabBtn');
      const xB = document.getElementById('expensesTabBtn');
      if (tab === 'earnings') {
        eS.classList.remove('hidden'); xS.classList.add('hidden');
        eB.classList.add('active'); xB.classList.remove('active');
      } else {
        eS.classList.add('hidden'); xS.classList.remove('hidden');
        xB.classList.add('active'); eB.classList.remove('active');
        initExpensesTab();
      }
    }

    function updateEarningsSummary() {
      const labelEl = document.getElementById('summaryPeriodLabel');
      const amountEl = document.getElementById('summaryAmount');
      let total = 0, label = '';
      const getStartOfWeek = (dStr) => {
        const d = toDate(dStr);
        const day = d.getDay();
        d.setDate(d.getDate() - day + (day === 0 ? -6 : 1));
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      };
      const isSameWeek = (a,b) => getStartOfWeek(a) === getStartOfWeek(b);
      const isSameMonth = (a,b) => a.substring(0,7) === b.substring(0,7);

      if (summaryMode === 'day') {
        total = earnings.filter(e => e.date === currentDay).reduce((s,e) => s + (parseFloat(e.amount)||0), 0);
        label = dayOpen ? 'Day Total' : 'Last Day Total';
      } else if (summaryMode === 'week') {
        total = earnings.filter(e => isSameWeek(e.date, currentDay)).reduce((s,e) => s + (parseFloat(e.amount)||0), 0);
        label = 'Week Total';
      } else {
        total = earnings.filter(e => isSameMonth(e.date, currentDay)).reduce((s,e) => s + (parseFloat(e.amount)||0), 0);
        label = 'Month Total';
      }
      labelEl.textContent = label;
      amountEl.textContent = formatCurrency(total);
    }

    function updateDayStatus() {
      const el = document.getElementById('dayStatus');
      el.classList.remove('open','stale','closed');
      if (!dayOpen) {
        el.classList.add('closed');
        el.textContent = `Day closed (${getReadableDate(currentDay)})`;
      } else if (currentDay === getTodayString()) {
        el.classList.add('open');
        el.textContent = 'Active day: Today';
      } else {
        el.classList.add('stale');
        el.textContent = `⚠️ Still on ${getReadableDate(currentDay)}`;
      }
      updateSlideState();
    }

    function updateSlideState() {
      const container = document.getElementById('slideContainer');
      const text = document.getElementById('slideText');
      if (dayOpen) {
        container.classList.remove('disabled');
        text.textContent = 'Slide to End Day';
      } else {
        container.classList.add('disabled');
        text.textContent = 'Day already closed';
      }
    }

    function renderEarningsList() {
      const list = document.getElementById('earningsList');
      list.innerHTML = '';
      const sorted = [...earnings].sort((a,b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
      sorted.forEach(e => {
        const li = document.createElement('li');
        li.innerHTML = `<div class="amount">$${formatCurrency(e.amount)}</div><div class="meta">${e.source} · ${getReadableDate(e.date)}</div>
          <div class="actions"><button class="edit" onclick="startEditEarnings('${e.id}')">✏️</button><button class="delete" onclick="deleteEarnings('${e.id}')">🗑️</button></div>`;
        list.appendChild(li);
      });
      if (earnings.length === 0) list.innerHTML = '<li style="opacity:0.6;">No earnings yet.</li>';
    }

    function updateEarningsSourceSelect() {
      const select = document.getElementById('earningsSourceSelect');
      const current = select.value;
      while (select.options.length > 3) select.remove(3);
      customSources.forEach(src => { const opt = document.createElement('option'); opt.value = src; opt.textContent = src; select.add(opt); });
      if (current && [...select.options].some(o => o.value === current)) select.value = current; else select.value = 'UberEats';
      document.getElementById('earningsCustomRow').classList.toggle('hidden', select.value !== '__custom__');
    }

    function addOrUpdateEarnings() {
      const amountInput = document.getElementById('earningsAmountInput');
      const sourceSelect = document.getElementById('earningsSourceSelect');
      const amount = parseFloat(amountInput.value);
      const source = sourceSelect.value;
      if (!amount || amount <= 0) { alert('Valid amount required.'); return; }
      if (source === '__custom__') { alert('Save custom source first.'); return; }

      if (editingEarningsId) {
        const i = earnings.findIndex(e => e.id === editingEarningsId);
        if (i !== -1) { earnings[i].amount = amount; earnings[i].source = source; }
        editingEarningsId = null;
        document.getElementById('earningsAddBtn').textContent = 'Update';
        document.getElementById('earningsCancelBtn').style.display = 'none';
      } else {
        if (!dayOpen) { currentDay = getTodayString(); dayOpen = true; showToast('New day started'); }
        earnings.push({ id: Date.now().toString() + Math.random().toString(36).substr(2,5), amount, source, date: currentDay });
      }
      amountInput.value = ''; sourceSelect.value = 'UberEats'; updateEarningsSourceSelect();
      saveData(); updateDayStatus(); updateEarningsSummary(); renderEarningsList();
    }

    function startEditEarnings(id) {
      const entry = earnings.find(e => e.id === id); if (!entry) return;
      editingEarningsId = id;
      document.getElementById('earningsAmountInput').value = entry.amount;
      document.getElementById('earningsSourceSelect').value = entry.source; updateEarningsSourceSelect();
      document.getElementById('earningsAddBtn').textContent = 'Update';
      document.getElementById('earningsCancelBtn').style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEditEarnings() {
      editingEarningsId = null;
      document.getElementById('earningsAmountInput').value = '';
      document.getElementById('earningsSourceSelect').value = 'UberEats';
      document.getElementById('earningsAddBtn').textContent = 'Add';
      document.getElementById('earningsCancelBtn').style.display = 'none';
      updateEarningsSourceSelect();
    }

    function deleteEarnings(id) {
      if (!confirm('Delete?')) return;
      earnings = earnings.filter(e => e.id !== id);
      if (editingEarningsId === id) cancelEditEarnings();
      saveData(); updateEarningsSummary(); renderEarningsList();
    }

    function addCustomSource() {
      const input = document.getElementById('earningsCustomInput');
      const name = input.value.trim(); if (!name) return;
      if (!customSources.includes(name)) { customSources.push(name); saveData(); }
      updateEarningsSourceSelect();
      document.getElementById('earningsSourceSelect').value = name; input.value = ''; updateEarningsSourceSelect();
    }

    // Slide Logic (Earnings)
    let isDragging = false, handleLeft = 4;
    const slideTrack = document.getElementById('slideTrack');
    const slideHandle = document.getElementById('slideHandle');
    const slideText = document.getElementById('slideText');
    function maxLeft() { return slideTrack.getBoundingClientRect().width - 4 - slideHandle.offsetWidth; }
    function resetSlide() {
      isDragging = false; handleLeft = 4; slideHandle.style.left = '4px';
      slideTrack.classList.remove('completed','dragging'); updateSlideState();
    }
    slideTrack.addEventListener('pointerdown', e => { if (!dayOpen) return; isDragging = true; slideTrack.classList.add('dragging'); slideTrack.setPointerCapture(e.pointerId); });
    slideTrack.addEventListener('pointermove', e => {
      if (!isDragging) return;
      const rect = slideTrack.getBoundingClientRect();
      let left = e.clientX - rect.left - slideHandle.offsetWidth / 2;
      left = Math.max(4, Math.min(maxLeft(), left)); handleLeft = left; slideHandle.style.left = left + 'px';
      if (left >= maxLeft() * 0.92) { slideTrack.classList.add('completed'); slideText.textContent = 'Release to end day'; }
      else { slideTrack.classList.remove('completed'); slideText.textContent = 'Slide to End Day'; }
    });
    function finishSlide() {
      if (!isDragging) return;
      const done = handleLeft >= maxLeft() * 0.92; resetSlide();
      if (done) { dayOpen = false; saveData(); updateDayStatus(); updateEarningsSummary(); showToast('Day closed'); }
    }
    slideTrack.addEventListener('pointerup', finishSlide);
    slideTrack.addEventListener('pointercancel', finishSlide);

    // ------------------- Expenses Logic -------------------
    function initExpensesTab() {
      populateMonthDropdown();
      updateMonthDisplay();
      setExpenseType('personal');
      document.getElementById('expenseDateInput').value = getTodayString();
      updateOweBalance();
      renderExpenseLists();
    }

    function populateMonthDropdown() {
      const dropdown = document.getElementById('monthDropdown');
      dropdown.innerHTML = '';
      
      const months = new Set();
      expenses.forEach(e => months.add(e.date.substring(0, 7)));
      months.add(getTodayString().substring(0, 7));
      
      const sorted = Array.from(months).sort().reverse();
      
      sorted.forEach(m => {
        const div = document.createElement('div');
        div.className = 'month-option';
        const d = new Date(m + '-01');
        div.textContent = d.toLocaleDateString(undefined, { month:'long', year:'numeric' });
        div.onclick = () => selectMonth(m);
        if (m === selectedMonth && !isYTD) div.classList.add('selected');
        dropdown.appendChild(div);
      });
    }

    function toggleMonthDropdown() {
      monthDropdownOpen = !monthDropdownOpen;
      const dropdown = document.getElementById('monthDropdown');
      dropdown.classList.toggle('show', monthDropdownOpen);
      document.getElementById('ytdBtn').classList.toggle('active', isYTD);
    }

    function selectMonth(month) {
      selectedMonth = month;
      isYTD = false;
      monthDropdownOpen = false;
      document.getElementById('monthDropdown').classList.remove('show');
      document.getElementById('ytdBtn').classList.remove('active');
      updateMonthDisplay();
      renderExpenseLists();
    }

    function selectYTD() {
      isYTD = true;
      monthDropdownOpen = false;
      document.getElementById('monthDropdown').classList.remove('show');
      document.getElementById('ytdBtn').classList.add('active');
      updateMonthDisplay();
      renderExpenseLists();
    }

    function updateMonthDisplay() {
      const display = document.getElementById('monthDisplay');
      if (isYTD) {
        display.textContent = 'Year to Date ▼';
      } else {
        display.textContent = getMonthLabel(selectedMonth + '-01') + ' ▼';
      }
      document.getElementById('workMonthLabel').textContent = isYTD ? 'YTD' : getMonthLabel(selectedMonth + '-01');
    }

    function setExpenseType(type) {
      expenseType = type;
      document.getElementById('typePersonalBtn').classList.toggle('active', type === 'personal');
      document.getElementById('typeWorkBtn').classList.toggle('active', type === 'work');
      document.getElementById('personalFields').classList.toggle('hidden', type !== 'personal');
      document.getElementById('workFields').classList.toggle('hidden', type !== 'work');
      updateExpenseCategorySelect();
    }

    function updateExpenseCategorySelect() {
      const select = document.getElementById('expenseCategorySelect');
      const current = select.value;
      select.innerHTML = '';
      
      const defaults = expenseType === 'personal' 
        ? ['Food', 'Rent', 'Utilities', 'Internet', 'Insurance', 'Groceries']
        : ['Gas', 'Insurance', 'Maintenance'];
      const customs = expenseType === 'personal' ? customPersonalCats : customWorkCats;

      defaults.forEach(c => { 
        const opt = document.createElement('option'); 
        opt.value = c; 
        opt.textContent = c; 
        select.add(opt); 
      });
      
      customs.forEach(c => { 
        const opt = document.createElement('option'); 
        opt.value = c; 
        opt.textContent = c; 
        select.add(opt); 
      });
      
      const optCustom = document.createElement('option'); 
      optCustom.value = '__custom__'; 
      optCustom.textContent = '+ Add custom…'; 
      select.add(optCustom);
      
      // Restore selection if valid
      if (current && current !== '__custom__' && [...select.options].some(o => o.value === current)) {
        select.value = current;
      } else {
        select.value = expenseType === 'personal' ? 'Food' : 'Gas';
      }
      
      handleCategoryChange();
    }

    function handleCategoryChange() {
      const select = document.getElementById('expenseCategorySelect');
      const isCustom = select.value === '__custom__';
      const catRow = expenseType === 'personal' 
        ? document.getElementById('personalCustomCatRow') 
        : document.getElementById('workCustomCatRow');
      catRow.classList.toggle('hidden', !isCustom);
    }

    function handleShareChange() {
      const select = document.getElementById('personalShareSelect');
      document.getElementById('personalCustomShareRow').classList.toggle('hidden', select.value !== '__custom__');
    }

    function setCustomShare() {
      const val = document.getElementById('personalCustomShareInput').value;
      if (val) {
        document.getElementById('personalShareSelect').value = '__custom__';
        handleShareChange();
      }
    }

    function addCustomPersonalCat() {
      const input = document.getElementById('personalCustomCatInput');
      const name = input.value.trim(); if (!name) return;
      if (!customPersonalCats.includes(name)) { customPersonalCats.push(name); saveData(); }
      updateExpenseCategorySelect();
      document.getElementById('expenseCategorySelect').value = name; 
      input.value = '';
      handleCategoryChange();
    }

    function addCustomWorkCat() {
      const input = document.getElementById('workCustomCatInput');
      const name = input.value.trim(); if (!name) return;
      if (!customWorkCats.includes(name)) { customWorkCats.push(name); saveData(); }
      updateExpenseCategorySelect();
      document.getElementById('expenseCategorySelect').value = name; 
      input.value = '';
      handleCategoryChange();
    }

    function updateOweBalance() {
      let gianOwesAbhi = 0;
      expenses.filter(e => e.type === 'personal').forEach(e => {
        const amount = parseFloat(e.amount) || 0;
        const share = parseFloat(e.share) || 100;
        const paidBy = e.paidBy;
        
        // Amount the OTHER person owes the payer
        const otherShare = (100 - share) / 100 * amount;
        
        if (paidBy === 'Abhi') gianOwesAbhi += otherShare;
        else if (paidBy === 'Gian') gianOwesAbhi -= otherShare;
      });

      const net = gianOwesAbhi - totalPaymentsRecorded;
      const amountEl = document.getElementById('balanceAmount');
      const labelEl = document.getElementById('balanceLabel');
      const whoEl = document.getElementById('balanceWho');
      
      amountEl.textContent = '$' + formatCurrency(Math.abs(net));
      
      if (net > 0.01) {
        labelEl.textContent = 'Gian owes Abhi';
        whoEl.textContent = '';
        whoEl.className = 'balance-who positive';
      } else if (net < -0.01) {
        labelEl.textContent = 'Abhi owes Gian';
        whoEl.textContent = '';
        whoEl.className = 'balance-who negative';
      } else {
        labelEl.textContent = 'All Settled';
        whoEl.textContent = '✓';
        whoEl.className = 'balance-who';
      }
    }

    // Payment Slider
    let paymentDragging = false, paymentHandleLeft = 4;
    const paymentTrack = document.getElementById('paymentSliderTrack');
    const paymentHandle = document.getElementById('paymentSliderHandle');
    const paymentText = document.getElementById('paymentSliderText');

    function paymentMaxLeft() { return paymentTrack.getBoundingClientRect().width - 4 - paymentHandle.offsetWidth; }

    function resetPaymentSlide() {
      paymentDragging = false; 
      paymentHandleLeft = 4; 
      paymentHandle.style.left = '4px';
      paymentTrack.classList.remove('completed','dragging');
      paymentText.textContent = 'Slide to Record Payment';
    }

    paymentTrack.addEventListener('pointerdown', e => {
      paymentDragging = true; 
      paymentTrack.classList.add('dragging'); 
      paymentTrack.setPointerCapture(e.pointerId);
    });
    paymentTrack.addEventListener('pointermove', e => {
      if (!paymentDragging) return;
      const rect = paymentTrack.getBoundingClientRect();
      let left = e.clientX - rect.left - paymentHandle.offsetWidth / 2;
      left = Math.max(4, Math.min(paymentMaxLeft(), left)); 
      paymentHandleLeft = left; 
      paymentHandle.style.left = left + 'px';
      if (left >= paymentMaxLeft() * 0.92) { 
        paymentTrack.classList.add('completed'); 
        paymentText.textContent = 'Release to record'; 
      } else { 
        paymentTrack.classList.remove('completed'); 
        paymentText.textContent = 'Slide to Record Payment'; 
      }
    });
    function finishPaymentSlide() {
      if (!paymentDragging) return;
      const done = paymentHandleLeft >= paymentMaxLeft() * 0.92;
      resetPaymentSlide();
      if (done) recordPayment();
    }
    paymentTrack.addEventListener('pointerup', finishPaymentSlide);
    paymentTrack.addEventListener('pointercancel', finishPaymentSlide);

    function recordPayment() {
      let gianOwesAbhi = 0;
      expenses.filter(e => e.type === 'personal').forEach(e => {
        const amount = parseFloat(e.amount) || 0;
        const share = parseFloat(e.share) || 100;
        const paidBy = e.paidBy;
        const otherShare = (100 - share) / 100 * amount;
        if (paidBy === 'Abhi') gianOwesAbhi += otherShare;
        else if (paidBy === 'Gian') gianOwesAbhi -= otherShare;
      });
      const net = gianOwesAbhi - totalPaymentsRecorded;
      totalPaymentsRecorded += net;
      saveData();
      updateOweBalance();
      showToast('Payment recorded - balance reset');
    }

    function toggleWorkBreakdown() {
      workBreakdownVisible = !workBreakdownVisible;
      const el = document.getElementById('workBreakdown');
      if (workBreakdownVisible) {
        const breakdown = {};
        let total = 0;
        expenses.filter(e => e.type === 'work' && (isYTD || e.date.substring(0,7) === selectedMonth)).forEach(e => {
          const cat = e.category;
          const amt = parseFloat(e.amount) || 0;
          breakdown[cat] = (breakdown[cat] || 0) + amt;
          total += amt;
        });
        
        let html = '';
        for (const [cat, amt] of Object.entries(breakdown)) {
          html += `<div class="breakdown-row"><span>${cat}</span><span>$${formatCurrency(amt)}</span></div>`;
        }
        el.innerHTML = html;
        el.classList.add('show');
      } else {
        el.classList.remove('show');
      }
    }

    function renderExpenseLists() {
      const filter = (e) => e.type === 'personal' && (isYTD || e.date.substring(0,7) === selectedMonth);
      const filterWork = (e) => e.type === 'work' && (isYTD || e.date.substring(0,7) === selectedMonth);

      const pList = document.getElementById('personalList');
      pList.innerHTML = '';
      expenses.filter(filter).sort((a,b) => b.date.localeCompare(a.date)).forEach(e => {
        const li = document.createElement('li');
        li.innerHTML = `<div class="amount">$${formatCurrency(e.amount)}</div>
          <div class="meta">${e.category} · ${e.paidBy} (${e.share}% owed) · ${getReadableDate(e.date)}</div>
          <div class="actions"><button class="edit" onclick="startEditExpense('${e.id}')">✏️</button><button class="delete" onclick="deleteExpense('${e.id}')">🗑️</button></div>`;
        pList.appendChild(li);
      });
      if (expenses.filter(filter).length === 0) pList.innerHTML = '<li style="opacity:0.6;">None</li>';

      const wList = document.getElementById('workList');
      wList.innerHTML = '';
      expenses.filter(filterWork).sort((a,b) => b.date.localeCompare(a.date)).forEach(e => {
        const li = document.createElement('li');
        li.innerHTML = `<div class="amount">$${formatCurrency(e.amount)}</div>
          <div class="meta">${e.category} · ${getReadableDate(e.date)}</div>
          <div class="actions"><button class="edit" onclick="startEditExpense('${e.id}')">✏️</button><button class="delete" onclick="deleteExpense('${e.id}')">🗑️</button></div>`;
        wList.appendChild(li);
      });
      if (expenses.filter(filterWork).length === 0) wList.innerHTML = '<li style="opacity:0.6;">None</li>';

      let workTotal = 0;
      expenses.filter(filterWork).forEach(e => workTotal += parseFloat(e.amount)||0);
      document.getElementById('workTotalDisplay').textContent = '$' + formatCurrency(workTotal);
      
      if (workBreakdownVisible) toggleWorkBreakdown();
      updateOweBalance();
    }

    function addOrUpdateExpense() {
      const dateInput = document.getElementById('expenseDateInput');
      const amountInput = document.getElementById('expenseAmountInput');
      const catSelect = document.getElementById('expenseCategorySelect');
      const date = dateInput.value;
      const amount = parseFloat(amountInput.value);
      let category = catSelect.value;

      if (!date) { alert('Select a date.'); return; }
      if (!amount || amount <= 0) { alert('Valid amount required.'); return; }
      if (category === '__custom__') { alert('Save custom category first.'); return; }

      let entry = {
        id: editingExpenseId || (Date.now().toString() + Math.random().toString(36).substr(2,5)),
        type: expenseType,
        date, amount, category
      };

      if (expenseType === 'personal') {
        const paidBy = document.getElementById('personalPaidBySelect').value;
        let share = document.getElementById('personalShareSelect').value;
        if (share === '__custom__') share = document.getElementById('personalCustomShareInput').value;
        entry.paidBy = paidBy;
        entry.share = share;
      }

      if (editingExpenseId) {
        const i = expenses.findIndex(e => e.id === editingExpenseId);
        if (i !== -1) expenses[i] = entry;
        editingExpenseId = null;
        document.getElementById('expenseAddBtn').textContent = 'Update';
        document.getElementById('expenseCancelBtn').style.display = 'none';
      } else {
        expenses.push(entry);
      }

      amountInput.value = '';
      dateInput.value = getTodayString();
      if (expenseType === 'personal') {
        document.getElementById('personalPaidBySelect').value = 'Abhi';
        document.getElementById('personalShareSelect').value = '100';
        document.getElementById('personalCustomShareRow').classList.add('hidden');
      }
      catSelect.value = expenseType === 'personal' ? 'Food' : 'Gas';
      handleCategoryChange();
      
      saveData();
      renderExpenseLists();
      showToast('Expense saved');
    }

    function startEditExpense(id) {
      const entry = expenses.find(e => e.id === id); if (!entry) return;
      editingExpenseId = id;
      document.getElementById('expenseDateInput').value = entry.date;
      document.getElementById('expenseAmountInput').value = entry.amount;
      setExpenseType(entry.type);
      
      const catSelect = document.getElementById('expenseCategorySelect');
      catSelect.value = entry.category;
      handleCategoryChange();
      
      if (entry.type === 'personal') {
        document.getElementById('personalPaidBySelect').value = entry.paidBy;
        const shareSelect = document.getElementById('personalShareSelect');
        const shareInput = document.getElementById('personalCustomShareInput');
        if (entry.share == 100) shareSelect.value = '100';
        else if (entry.share == 50) shareSelect.value = '50';
        else { shareSelect.value = '__custom__'; shareInput.value = entry.share; }
        handleShareChange();
      }

      document.getElementById('expenseAddBtn').textContent = 'Update';
      document.getElementById('expenseCancelBtn').style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEditExpense() {
      editingExpenseId = null;
      document.getElementById('expenseAmountInput').value = '';
      document.getElementById('expenseDateInput').value = getTodayString();
      document.getElementById('expenseAddBtn').textContent = 'Add';
      document.getElementById('expenseCancelBtn').style.display = 'none';
      setExpenseType('personal');
    }

    function deleteExpense(id) {
      if (!confirm('Delete?')) return;
      expenses = expenses.filter(e => e.id !== id);
      if (editingExpenseId === id) cancelEditExpense();
      saveData(); renderExpenseLists();
    }

    // ------------------- Listeners -------------------
    document.getElementById('earningsAddBtn').addEventListener('click', addOrUpdateEarnings);
    document.getElementById('earningsCancelBtn').addEventListener('click', cancelEditEarnings);
    document.getElementById('earningsSourceSelect').addEventListener('change', updateEarningsSourceSelect);
    document.getElementById('earningsAmountInput').addEventListener('keydown', e => { if (e.key === 'Enter') addOrUpdateEarnings(); });
    document.getElementById('earningsCustomInput').addEventListener('keydown', e => { if (e.key === 'Enter') addCustomSource(); });
    document.getElementById('summaryBtn').addEventListener('click', () => {
      const modes = ['day','week','month'];
      summaryMode = modes[(modes.indexOf(summaryMode) + 1) % modes.length];
      updateEarningsSummary();
    });

    document.getElementById('expenseAddBtn').addEventListener('click', addOrUpdateExpense);
    document.getElementById('expenseCancelBtn').addEventListener('click', cancelEditExpense);
    document.getElementById('expenseAmountInput').addEventListener('keydown', e => { if (e.key === 'Enter') addOrUpdateExpense(); });
    document.getElementById('personalCustomCatInput').addEventListener('keydown', e => { if (e.key === 'Enter') addCustomPersonalCat(); });
    document.getElementById('workCustomCatInput').addEventListener('keydown', e => { if (e.key === 'Enter') addCustomWorkCat(); });

    // Close dropdown when clicking outside
    document.addEventListener('click', e => {
      if (!e.target.closest('.month-display') && !e.target.closest('.month-dropdown')) {
        monthDropdownOpen = false;
        document.getElementById('monthDropdown').classList.remove('show');
      }
    });

    // ------------------- Init -------------------
    updateEarningsSourceSelect();
    updateDayStatus();
    updateEarningsSummary();
    renderEarningsList();
    resetSlide();
  </script>
</body>
</html>
